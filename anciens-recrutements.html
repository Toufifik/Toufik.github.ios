<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche d'ancien recrutement</title><link rel="stylesheet" href="style.css">
<style>
.history-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.search{width:100%;max-width:520px;padding:13px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#111820;color:#fff}
.old-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.recruit-card{cursor:pointer;padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.04);transition:.2s}
.recruit-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.recruit-card h3{margin:0 0 8px}.recruit-card p{margin:6px 0;opacity:.85}
.status{font-weight:800;margin-top:12px}.accepted{color:#8ee28e}.refused{color:#ff8d8d}.empty{text-align:center;opacity:.7;padding:35px;grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:#10171e;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:24px;position:relative}
.close{position:absolute;right:15px;top:12px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detail{padding:13px;border-radius:10px;background:rgba(255,255,255,.05)}.detail span{display:block;font-size:12px;opacity:.6;margin-bottom:4px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:600px){.details{grid-template-columns:1fr}}
</style></head>
<body>
<header><nav class="nav"><div class="logo">RÉGIMENTS</div><a href="index.html">Accueil</a><a href="theorique.html">Théorique</a><a href="construction.html">Construction</a><a href="notation.html">Notation</a><a href="fiches.html">Fiches</a><a href="anciens-recrutements.html" class="active">Anciens recrutements</a></nav></header>
<main class="container">
<div class="history-head"><div><h1>Fiche d'ancien recrutement</h1><p>Tous les recrutements enregistrés sont visibles ici par tous les utilisateurs.</p></div><input id="search" class="search" type="search" placeholder="Rechercher par nom, matricule, Steam ID ou régiment..."></div>
<section id="oldList" class="old-list"></section>
</main>
<div id="modal" class="modal"><div class="modal-box"><button id="close" class="close">×</button><h2 id="title"></h2><div id="details" class="details"></div><div class="modal-actions"><button id="copy">📋 Copier / coller pour Discord</button><button id="delete">🗑️ Supprimer</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient("https://tziymtfcvpvbgfwpfiyb.supabase.co","sb_publishable_FT2l5rP1bmjxBBn6YAX6Kg_E5wBeiWV");
let current=null;const $=id=>document.getElementById(id);
const esc=s=>String(s??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function discord(r){return `**📋 FICHE DE RECRUTEMENT**

**Nom :** ${r.nom}
**Matricule :** ${r.matricule}
**Steam ID :** ${r.steam}
**Régiment :** ${r.regiment}
**Date :** ${r.date}

**Note théorique :** ${r.theorique}/100
**Note pratique :** ${r.pratique}/100
**Note finale :** ${r.total}/100

**Décision :** ${r.decision}`;}
async function render(){
 const {data,error}=await supabaseClient.from("recrutements").select("*").order("created_at",{ascending:false});
 if(error){$("oldList").innerHTML='<div class="empty">Impossible de charger les recrutements : '+esc(error.message)+'</div>';return}
 const q=$("search").value.toLowerCase().trim();
 const rows=(data||[]).filter(r=>[r.nom,r.matricule,r.steam,r.regiment].some(v=>String(v??"").toLowerCase().includes(q)));
 if(!rows.length){$("oldList").innerHTML='<div class="empty">Aucun ancien recrutement trouvé.</div>';return}
 $("oldList").innerHTML=rows.map(r=>`<article class="recruit-card" data-id="${r.id}"><h3>${esc(r.nom)}</h3><p><strong>Matricule :</strong> ${esc(r.matricule)}</p><p><strong>Régiment :</strong> ${esc(r.regiment)}</p><p><strong>Date :</strong> ${esc(r.date)}</p><p><strong>Note :</strong> ${esc(r.total)}/100</p><div class="status ${r.decision==="ACCEPTÉ"?"accepted":"refused"}">${esc(r.decision)}</div></article>`).join("");
 document.querySelectorAll(".recruit-card").forEach(c=>c.onclick=()=>open(Number(c.dataset.id),rows));
}
function open(id,rows){const r=rows.find(x=>x.id===id);if(!r)return;current=r;$("title").textContent="Fiche de recrutement — "+r.nom;$("details").innerHTML=`<div class="detail"><span>Nom</span><strong>${esc(r.nom)}</strong></div><div class="detail"><span>Matricule</span><strong>${esc(r.matricule)}</strong></div><div class="detail"><span>Steam ID</span><strong>${esc(r.steam)}</strong></div><div class="detail"><span>Régiment</span><strong>${esc(r.regiment)}</strong></div><div class="detail"><span>Date</span><strong>${esc(r.date)}</strong></div><div class="detail"><span>Note théorique</span><strong>${esc(r.theorique)}/100</strong></div><div class="detail"><span>Note pratique</span><strong>${esc(r.pratique)}/100</strong></div><div class="detail"><span>Note finale</span><strong>${esc(r.total)}/100</strong></div><div class="detail"><span>Décision</span><strong>${esc(r.decision)}</strong></div>`;$("modal").classList.add("open")}
$("search").oninput=render;$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};
$("copy").onclick=async()=>{if(!current)return;try{await navigator.clipboard.writeText(discord(current))}catch(e){}alert("Fiche copiée ! Tu peux la coller sur Discord.")};
$("delete").onclick=async()=>{if(!current||!confirm("Supprimer définitivement ce recrutement ?"))return;const {error}=await supabaseClient.from("recrutements").delete().eq("id",current.id);if(error){alert("Erreur : "+error.message);return}$("modal").classList.remove("open");current=null;render()};
render();
</script></body></html>
