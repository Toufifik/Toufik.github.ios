<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notation</title><link rel="stylesheet" href="style.css"></head><body><header><nav><a class="logo" href="index.html">🪖 RÉGIMENTS</a><a href="index.html">Accueil</a><a href="theorique.html">📚 Théorique</a><a href="construction.html">🏗️ Construction</a><a class="active" href="notation.html">📝 Notation</a><a href="fiches.html">📋 Fiches</a></nav></header><main><section class="hero"><small>SECTION 3</small><h1>Fiche de notation</h1><p>Les critères changent selon le régiment.</p></section><section class="card"><label for="reg">Régiment</label><select id="reg"><option>41st</option><option>65st</option></select></section><section class="card"><h2>Évaluation</h2><div id="notes" class="list"></div><div id="result" class="result"></div></section></main><footer>Site de gestion des régiments • GitHub Pages</footer><script>
const C={"41st":[["Traque",2],["Reconnaissance",3]],"65st":[["Extraction VIP",3],["CQB",4]]},r=document.getElementById("reg"),n=document.getElementById("notes"),res=document.getElementById("result");
function draw(){n.innerHTML="";C[r.value].forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML="<strong>"+x[0]+"</strong><span>Coefficient : "+x[1]+"</span><label>Note / 20</label><input class='note' type='number' min='0' max='20' value='0'>";d.querySelector("input").oninput=calc;n.appendChild(d)});calc()}function calc(){let a=0,b=0;n.querySelectorAll(".note").forEach((e,i)=>{let v=Math.max(0,Math.min(20,Number(e.value)||0));a+=v*C[r.value][i][1];b+=C[r.value][i][1]});res.textContent="Note finale : "+(a/b).toFixed(2)+" / 20"}r.onchange=draw;draw();
</script></body></html>
