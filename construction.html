<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction</title><link rel="stylesheet" href="style.css"></head><body><header><nav><a class="logo" href="index.html">🪖 RÉGIMENTS</a><a href="index.html">Accueil</a><a href="theorique.html">📚 Théorique</a><a class="active" href="construction.html">🏗️ Construction</a><a href="notation.html">📝 Notation</a><a href="fiches.html">📋 Fiches</a></nav></header><main><section class="hero"><small>SECTION 2</small><h1>Fichier construction</h1><p>Choisis un régiment pour afficher ses constructions.</p></section><section class="card"><label for="regiment">Régiment</label><select id="regiment"><option value="">— Sélectionner un régiment —</option><option>41st</option><option>65st</option></select></section><section class="card"><h2 id="titre">Aucun régiment sélectionné</h2><div id="liste" class="list"></div></section></main><footer>Site de gestion des régiments • GitHub Pages</footer><script>
const DATA={ "41st":[["Traque","FICHE DE CONSTRUCTION\n\nRégiment : 41st\nConstruction : Traque\n\nMatériel nécessaire :\n- À compléter\n- À compléter\n\nProcédure :\n1. À compléter\n2. À compléter\n3. À compléter"],["Reconnaissance","FICHE DE CONSTRUCTION\n\nRégiment : 41st\nConstruction : Reconnaissance\n\nMatériel nécessaire :\n- À compléter\n- À compléter\n\nProcédure :\n1. À compléter\n2. À compléter\n3. À compléter"]], "65st":[["Extraction VIP","FICHE DE CONSTRUCTION\n\nRégiment : 65st\nConstruction : Extraction VIP\n\nMatériel nécessaire :\n- À compléter\n- À compléter\n\nProcédure :\n1. À compléter\n2. À compléter\n3. À compléter"],["CQB","FICHE DE CONSTRUCTION\n\nRégiment : 65st\nConstruction : CQB\n\nMatériel nécessaire :\n- À compléter\n- À compléter\n\nProcédure :\n1. À compléter\n2. À compléter\n3. À compléter"]]};
const s=document.getElementById("regiment"),l=document.getElementById("liste"),t=document.getElementById("titre");
s.onchange=()=>{l.innerHTML="";if(!s.value){t.textContent="Aucun régiment sélectionné";return}t.textContent="Régiment : "+s.value;DATA[s.value].forEach((x,i)=>{const d=document.createElement("div");d.className="item";d.innerHTML="<strong>Construction "+(i+1)+"</strong><span>"+x[0]+"</span><button>⬇️ Télécharger</button>";d.querySelector("button").onclick=()=>{const u=URL.createObjectURL(new Blob([x[1]],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=x[0]+".txt";a.click();URL.revokeObjectURL(u)};l.appendChild(d)})};
</script></body></html>
