<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fichier construction</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ========================= -->
    <!-- MENU -->
    <!-- ========================= -->

    <header>

        <nav>

            <a
                class="logo"
                href="index.html"
            >
                🪖 RÉGIMENTS
            </a>

            <a href="index.html">
                Accueil
            </a>

            <a href="theorique.html">
                📚 Théorique
            </a>

            <a
                class="active"
                href="construction.html"
            >
                🏗️ Construction
            </a>

            <a href="notation.html">
                📝 Notation
            </a>

            <a href="fiches.html">
                📋 Fiches
            </a>

        </nav>

    </header>


    <!-- ========================= -->
    <!-- CONTENU -->
    <!-- ========================= -->

    <main>


        <!-- TITRE -->

        <section class="hero">

            <small>
                SECTION 2
            </small>

            <h1>
                Fichier construction
            </h1>

            <p>
                Choisis un régiment pour afficher les constructions nécessaires.
            </p>

        </section>


        <!-- ========================= -->
        <!-- CHOIX DU RÉGIMENT -->
        <!-- ========================= -->

        <section class="card">

            <label for="regiment">

                Régiment

            </label>


            <select id="regiment">

                <option value="">

                    — Sélectionner un régiment —

                </option>


                <option value="41st">

                    41st

                </option>


                <option value="65st">

                    65st

                </option>

            </select>

        </section>


        <!-- ========================= -->
        <!-- CONSTRUCTIONS -->
        <!-- ========================= -->

        <section class="card">

            <h2 id="titre">

                Aucun régiment sélectionné

            </h2>


            <div
                id="liste"
                class="list"
            >

                <!-- Les constructions apparaîtront ici -->

            </div>

        </section>


    </main>


    <!-- ========================= -->
    <!-- PIED DE PAGE -->
    <!-- ========================= -->

    <footer>

        Site de gestion des régiments • GitHub Pages

    </footer>


    <!-- ========================= -->
    <!-- SCRIPT -->
    <!-- ========================= -->

    <script>

        const DATA = {


            /* ========================= */
            /* 41ST */
            /* ========================= */

            "41st": [

                {

                    nom: "Traque",

                    contenu: `
FICHE DE CONSTRUCTION

Régiment : 41st

Construction : Traque


Matériel nécessaire :

- À compléter
- À compléter
- À compléter


Procédure :

1. À compléter
2. À compléter
3. À compléter


Notes :

À compléter
`

                },


                {

                    nom: "Reconnaissance",

                    contenu: `
FICHE DE CONSTRUCTION

Régiment : 41st

Construction : Reconnaissance


Matériel nécessaire :

- À compléter
- À compléter
- À compléter


Procédure :

1. À compléter
2. À compléter
3. À compléter


Notes :

À compléter
`

                }

            ],


            /* ========================= */
            /* 65ST */
            /* ========================= */

            "65st": [

                {

                    nom: "Extraction VIP",

                    contenu: `
FICHE DE CONSTRUCTION

Régiment : 65st

Construction : Extraction VIP


Matériel nécessaire :

- À compléter
- À compléter
- À compléter


Procédure :

1. À compléter
2. À compléter
3. À compléter


Notes :

À compléter
`

                },


                {

                    nom: "CQB",

                    contenu: `
FICHE DE CONSTRUCTION

Régiment : 65st

Construction : CQB


Matériel nécessaire :

- À compléter
- À compléter
- À compléter


Procédure :

1. À compléter
2. À compléter
3. À compléter


Notes :

À compléter
`

                }

            ]

        };


        /* ========================= */
        /* ÉLÉMENTS DE LA PAGE */
        /* ========================= */

        const select =
            document.getElementById("regiment");


        const liste =
            document.getElementById("liste");


        const titre =
            document.getElementById("titre");


        /* ========================= */
        /* CHANGEMENT DE RÉGIMENT */
        /* ========================= */

        select.addEventListener(
            "change",
            function () {


                liste.innerHTML = "";


                /* Aucun régiment */

                if (!select.value) {

                    titre.textContent =
                        "Aucun régiment sélectionné";

                    return;

                }


                /* Nom du régiment */

                titre.textContent =
                    "Régiment : " + select.value;


                /* Récupération des constructions */

                const constructions =
                    DATA[select.value];


                /* Création des fiches */

                constructions.forEach(
                    function (construction, index) {


                        const element =
                            document.createElement("div");


                        element.className =
                            "item";


                        element.innerHTML = `

                            <strong>

                                Construction ${index + 1}

                            </strong>


                            <span>

                                ${construction.nom}

                            </span>


                            <button
                                type="button"
                            >

                                ⬇️ Télécharger

                            </button>

                        `;


                        /* Bouton télécharger */

                        const bouton =
                            element.querySelector("button");


                        bouton.addEventListener(
                            "click",
                            function () {


                                const fichier =
                                    new Blob(
                                        [
                                            construction.contenu
                                        ],
                                        {
                                            type:
                                                "text/plain;charset=utf-8"
                                        }
                                    );


                                const url =
                                    URL.createObjectURL(
                                        fichier
                                    );


                                const lien =
                                    document.createElement("a");


                                lien.href =
                                    url;


                                lien.download =
                                    construction.nom + ".txt";


                                document.body.appendChild(
                                    lien
                                );


                                lien.click();


                                document.body.removeChild(
                                    lien
                                );


                                URL.revokeObjectURL(
                                    url
                                );

                            }
                        );


                        liste.appendChild(
                            element
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
